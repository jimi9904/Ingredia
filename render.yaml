services:
  - type: web
    name: ingredia-backend
    env: node
    rootDir: Ingredia/backend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /up
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: FRONTEND_URL
        sync: false
